<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MOTHER2">
<title>MOTHER2</title>
<style>
:root{
  --bg:#14121a; --panel:#1f1c28; --line:#38334a; --text:#ece8f5; --dim:#a39cb8;
  --accent:#ffcf4a; --ok:#7ee0a5; --warn:#ffb36b; --bad:#ff7a8a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;margin:0}
header h1 span{color:var(--accent)}
#status{font-size:13px;color:var(--dim);margin-left:auto;text-align:right}
#status.ok{color:var(--ok)} #status.warn{color:var(--warn)}
#cloud{font-size:12px;color:var(--dim)}
main{flex:1;display:flex;flex-direction:column;min-height:0}
.card{max-width:440px;width:calc(100% - 32px);margin:32px auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:12px}
.card h2{margin:0;font-size:18px}
.card p{margin:0;color:var(--dim);font-size:14px;line-height:1.6}
label{display:grid;gap:4px;font-size:13px;color:var(--dim)}
input[type=email],input[type=password]{font:inherit;font-size:15px;color:var(--text);background:#2a2636;border:1px solid var(--line);border-radius:9px;padding:10px 12px}
button{font:inherit;font-size:14px;color:var(--text);background:#2c2839;border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:#1b1500;border-color:var(--accent);font-weight:700;padding:11px 16px;font-size:15px}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.err{color:var(--bad);font-size:13px;min-height:1em}
.drop{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;cursor:pointer;color:var(--dim);font-size:14px;line-height:1.6}
.drop.over{border-color:var(--accent)}
.drop b{color:var(--accent)}
.flist{display:grid;gap:6px;font-size:13px}
.flist div{display:flex;justify-content:space-between;gap:8px}
.flist span:last-child{text-align:right;word-break:break-all}
.none{color:#6f6886}
#play{flex:1;display:flex;flex-direction:column;min-height:0}
#gamewrap{flex:1;min-height:0;position:relative;background:#000}
#game{position:absolute;inset:0}
#bar{display:flex;gap:6px;padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
#bar .sp{flex:1}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;max-width:480px;width:calc(100% - 32px);max-height:80vh}
dialog::backdrop{background:#000a}
dialog h3{margin:0 0 6px;font-size:16px}
dialog h4{margin:14px 0 4px;font-size:13px;color:var(--dim);font-weight:600}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.slot small{color:var(--dim)}
.slot .acts{display:flex;gap:6px;flex:none}
.slot .x{padding:6px 10px;color:var(--bad);border-color:#5a2f3a}
.tag{font-size:11px;padding:1px 6px;border-radius:99px;background:#2c2839;color:var(--dim);margin-left:4px}
input[type=file]{display:none}
[hidden]{display:none!important}
@media (max-width:600px){ #bar button{padding:7px 9px;font-size:13px} }
/* 에뮬레이터 자체 메뉴(아래 상태창·우클릭 메뉴) 숨김: 게임 중 저절로 올라오지 않게 */
.ejs_menu_bar, .ejs_menu_bar_hidden, .ejs_context_menu, .ejs_menu_button { display: none !important; }
</style>
</head>
<body>
<header>
  <h1><span>MOTHER2</span></h1>
  <span id="cloud"></span>
  <div id="status">불러오는 중…</div>
</header>
<main>
  <!-- 로그인 -->
  <section class="card" id="vLogin" hidden>
    <h2>관리자 번호</h2>
    <p>번호를 넣으면 이 기기에서는 계속 로그인돼 있어요.</p>
    <input type="email" id="email" autocomplete="username" value="mother2-owner@example.com" hidden>
    <label>번호 <input type="password" id="pw" inputmode="numeric" autocomplete="current-password" style="font-size:22px;letter-spacing:.3em;text-align:center"></label>
    <div class="err" id="loginErr"></div>
    <button class="primary" id="bLogin">입장</button>
    <button id="bSignup" hidden>처음 한 번: 이 번호로 설정하기</button>
  </section>

  <!-- 처음 한 번: 롬 올리기 -->
  <section class="card" id="vUpload" hidden>
    <h2>처음 한 번만: 게임 파일 올리기</h2>
    <p>롬은 내 계정만 열 수 있는 비공개 저장소에 들어가요. 한 번 올리면 다른 기기에서는 로그인만 하면 돼요.</p>
    <div class="drop" id="drop"><b>파일을 끌어다 놓거나 눌러서 선택</b><br>롬(.sfc), 게임 세이브(.srm), Snes9x 상태(.000 등, 선택)</div>
    <input type="file" id="picker" multiple>
    <div class="flist">
      <div><span>롬</span><span id="fRom" class="none">없음</span></div>
      <div><span>게임 세이브</span><span id="fSrm" class="none">없음 (새 게임)</span></div>
      <div><span>상태 저장</span><span id="fState" class="none">없음</span></div>
    </div>
    <div class="err" id="upErr"></div>
    <button class="primary" id="bUpload" disabled>올리고 시작하기</button>
    <button id="bUpCancel" hidden>취소하고 게임으로 돌아가기</button>
  </section>

  <!-- 게임 -->
  <section id="play" hidden>
    <div id="gamewrap"><div id="game"></div></div>
    <div id="bar">
      <button id="bSaveState">상태 저장</button>
      <button id="bHistory">저장 기록</button>
      <span class="sp"></span>
      <button id="bFull">전체화면</button>
      <button id="bExport">.srm 받기</button>
      <button id="bMenu">설정</button>
    </div>
  </section>
</main>

<dialog id="dHistory">
  <h3>저장 기록</h3>
  <p class="none" style="margin:0;font-size:13px">상태는 그 순간으로 바로 돌아가요. 게임 세이브를 고르면 그 세이브로 처음부터 다시 켜요.</p>
  <div id="histBody"></div>
  <div class="row" style="margin-top:12px"><button id="bHistUpload">세이브 파일 올리기</button><button id="dHistoryClose">닫기</button></div>
</dialog>

<dialog id="dMenu">
  <h3>설정</h3>
  <div style="display:grid;gap:8px;margin-top:8px">
    <button id="bAddFiles">파일 더 올리기 (.srm / 상태 / 롬 교체)</button>
    <button id="bLogout">로그아웃</button>
    <button id="dMenuClose">닫기</button>
  </div>
</dialog>

<dialog id="dConfirm">
  <p id="confirmText" style="line-height:1.6"></p>
  <div class="row"><button id="cNo">취소</button><button class="primary" id="cYes">확인</button></div>
</dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
"use strict";
const EJS_DATA = "https://cdn.emulatorjs.org/4.2.3/data/";
const BUCKET = "mother2";
const SRM_CHECK_SEC = 20;       // 게임 세이브 변경 확인 간격

const $ = id => document.getElementById(id);
const cfg = window.MOTHER2_CONFIG || {};
const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
let uid = null;

/* 켜지는 과정을 계정에 기록(문제 진단용) */
const SESSION = Math.random().toString(36).slice(2, 8), T0 = Date.now();
let logOn = false;
function blog(step, info) {
  if (!logOn) return;
  try { sb.from("mother2_log").insert({ session: SESSION, ms: Date.now() - T0, step: String(step).slice(0, 200), info: info == null ? null : String(info).slice(0, 500), ua: navigator.userAgent.slice(0, 200) }).then(() => {}, () => {}); } catch (e) {}
}
window.addEventListener("error", e => blog("error", (e.message || "") + " @" + (e.filename || "").split("/").pop() + ":" + e.lineno));
window.addEventListener("unhandledrejection", e => blog("rejection", e.reason && (e.reason.message || e.reason)));
function setStatus(t, cls) { const s = $("status"); s.textContent = t; s.className = cls || ""; blog("status", t); }
function setCloud(t) { $("cloud").textContent = t; }
const fmt = ts => new Date(ts).toLocaleString("ko-KR", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"});
const show = id => { for (const v of ["vLogin","vUpload","play"]) $(v).hidden = v !== id; };
const tsName = () => String(Date.now()).padStart(14, "0");
const tsOf = name => Number(name.split(/[-.]/)[0]);

function ask(text) {
  return new Promise(res => {
    $("confirmText").textContent = text;
    const d = $("dConfirm");
    $("cYes").onclick = () => { d.close(); res(true); };
    $("cNo").onclick = () => { d.close(); res(false); };
    d.showModal();
  });
}

/* ---------- 이 기기 캐시 (롬을 매번 받지 않도록) ---------- */
const local = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error("idb timeout")), 3000);
    try {
      const r = indexedDB.open("mother2-cache", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => { clearTimeout(t); res(r.result); };
      r.onerror = () => { clearTimeout(t); rej(r.error); };
    } catch (e) { clearTimeout(t); rej(e); }
  }).catch(e => { p = null; throw e; }));
  const tx = async (mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction("kv", mode); const r = fn(t.objectStore("kv"));
      t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error);
    });
  };
  return {
    get: k => tx("readonly", s => s.get(k)).catch(() => null),
    set: (k, v) => tx("readwrite", s => s.put(v, k)).catch(() => null),
  };
})();

/* ---------- 클라우드 저장소 ---------- */
const store = () => sb.storage.from(BUCKET);
const P = sub => `${uid}/${sub}`;
async function up(path, data) {
  const { error } = await store().upload(P(path), new Blob([data]), { upsert: true, contentType: "application/octet-stream", cacheControl: "0" });
  if (error) throw error;
}
async function down(path) {
  const { data, error } = await store().download(P(path));
  if (error) throw error;
  return new Uint8Array(await data.arrayBuffer());
}
async function ls(dir, limit = 1000) {
  const { data, error } = await store().list(P(dir), { limit, sortBy: { column: "name", order: "desc" } });
  if (error) throw error;
  return (data || []).filter(f => f.id);   // 폴더 제외
}
async function prune(dir, keep, filter = () => true) {
  const files = (await ls(dir)).filter(f => filter(f.name));
  const old = files.slice(keep).map(f => P(`${dir}/${f.name}`));
  if (old.length) await store().remove(old);
}

/* ---------- 파일 받기 ---------- */
const pending = { rom: null, srm: null, state: null };
async function gunzipIfNeeded(u8) {
  if (u8[0] === 0x1f && u8[1] === 0x8b) {
    const out = new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"));
    return new Uint8Array(await new Response(out).arrayBuffer());
  }
  return u8;
}
async function takeFiles(list) {
  const files = [...list].sort((a, b) => (b.lastModified || 0) - (a.lastModified || 0));
  const skipped = [];
  for (const f of files) {
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    const data = new Uint8Array(await f.arrayBuffer());
    if (["sfc","smc","swc","fig"].includes(ext)) pending.rom = { name: f.name, data };
    else if (["srm","sav"].includes(ext)) { if (!pending.srm) pending.srm = { name: f.name, data }; }
    else if (/^(\d{3}|oops|state)$/.test(ext)) { if (!pending.state) pending.state = { name: f.name, data: await gunzipIfNeeded(data) }; }
    else skipped.push(f.name);
  }
  const set = (id, v, none) => { const e = $(id); e.textContent = v || none; e.classList.toggle("none", !v); };
  set("fRom", pending.rom && pending.rom.name, romReady ? "올라가 있음 (바꾸려면 넣기)" : "없음");
  set("fSrm", pending.srm && pending.srm.name, "없음");
  set("fState", pending.state && pending.state.name, "없음");
  $("bUpload").disabled = !(pending.rom || romReady) || !(pending.rom || pending.srm || pending.state);
  $("upErr").textContent = skipped.length ? `모르는 형식이라 건너뜀: ${skipped.join(", ")}` : "";
}
let romReady = false;

async function uploadPending() {
  $("bUpload").disabled = true;
  try {
    if (pending.rom) { setStatus("롬 올리는 중… (6MB)"); await up("rom.sfc", pending.rom.data); await local.set("rom", { data: pending.rom.data, key: "new" }); }
    if (pending.srm) { setStatus("세이브 올리는 중…"); await up(`srm/${tsName()}-upload.srm`, pending.srm.data); }
    if (pending.state) { setStatus("상태 올리는 중…"); await up(`states/${tsName()}-import.state`, pending.state.data); }
    const startState = pending.state && pending.state.data;
    pending.rom = pending.srm = pending.state = null;
    if (started) { location.reload(); return; }
    await boot(startState);
  } catch (e) {
    $("upErr").textContent = "올리지 못했어요: " + (e.message || e);
    $("bUpload").disabled = false;
    setStatus("업로드 실패", "warn");
  }
}

/* ---------- 시작 ---------- */
async function getRom() {
  const root = await ls("", 100);
  const meta = root.find(f => f.name === "rom.sfc");
  if (!meta) return null;
  const key = meta.updated_at + ":" + (meta.metadata && meta.metadata.size);
  const cached = await local.get("rom");
  if (cached && (cached.key === key || cached.key === "new")) {
    if (cached.key === "new") await local.set("rom", { data: cached.data, key });
    return cached.data;
  }
  setStatus("롬 받는 중… (이 기기에서 처음 한 번)");
  const data = await down("rom.sfc");
  await local.set("rom", { data, key });
  return data;
}

async function boot(startState) {
  setStatus("계정 저장소 확인 중…");
  let rom = await getRom();
  romReady = !!rom;
  if (!rom) { show("vUpload"); setStatus("롬을 한 번 올려 주세요"); return; }

  // Claude가 넣어 둔 세이브가 있으면 저장소로 옮기고 그걸로 시작
  try {
    const { data: imps } = await sb.from("mother2_import").select("id,kind,data_b64,label").order("id");
    for (const imp of imps || []) {
      if (imp.kind === "rompatch") {
        // 롬의 바뀐 부분만 적용해서 계정의 롬을 새 버전으로 교체
        setStatus("롬 업데이트 적용 중…");
        const raw = await gunzipIfNeeded(Uint8Array.from(atob(imp.data_b64), c => c.charCodeAt(0)));
        const out = new Uint8Array(rom); const dv = new DataView(raw.buffer, raw.byteOffset, raw.byteLength);
        for (let k = 0; k < raw.length;) { const o = dv.getUint32(k, true), n = dv.getUint16(k + 4, true); out.set(raw.subarray(k + 6, k + 6 + n), o); k += 6 + n; }
        await up("rom.sfc", out);
        await local.set("rom", { data: out, key: "new" });
        rom = out;
        await sb.from("mother2_import").delete().eq("id", imp.id);
        setCloud("☁ " + (imp.label || "롬 업데이트") + " 적용됨");
        continue;
      }
      if (imp.kind === "cleanup") {
        // 올린 세이브(-upload)만 남기고 나머지 세이브·상태 모두 정리
        const keepSrm = (await ls("srm")).filter(f => !f.name.includes("-upload")).map(f => P(`srm/${f.name}`));
        const allStates = (await ls("states")).map(f => P(`states/${f.name}`));
        const del = keepSrm.concat(allStates);
        if (del.length) { const r = await store().remove(del); if (r.error) throw r.error; }
        await sb.from("mother2_import").delete().eq("id", imp.id);
        setCloud("☁ 정리 완료: 올린 세이브만 남김");
        continue;
      }
      const bytes = await gunzipIfNeeded(Uint8Array.from(atob(imp.data_b64), c => c.charCodeAt(0)));
      if (imp.kind === "srm") await up(`srm/${tsName()}-upload.srm`, bytes);
      else { await up(`states/${tsName()}-import.state`, bytes); startState = bytes; }
      await sb.from("mother2_import").delete().eq("id", imp.id);
      setCloud("☁ " + (imp.label || "세이브") + " 적용됨");
    }
  } catch (e) { console.warn("import", e); }

  // 예전 버전이 만든 자동 저장은 모두 지움 (새 버전은 자동 저장을 만들지 않음)
  try {
    const autos = (await ls("states")).filter(f => f.name.includes("-auto")).map(f => P(`states/${f.name}`));
    if (autos.length) { await store().remove(autos); blog("removed_auto", autos.length); }
  } catch (e) {}

  const srms = await ls("srm", 1);
  let srm = null;
  if (srms.length) { srm = { data: await down(`srm/${srms[0].name}`), time: tsOf(srms[0].name) }; }
  show("play");
  // 아이폰/아이패드는 화면을 한 번 터치한 뒤에 시작해야 소리·화면 처리가 막히지 않음
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (isIOS) {
    blog("tap_wait");
    setStatus("화면을 터치하면 게임이 시작돼요", "ok");
    await new Promise(res => {
      const b = document.createElement("button"); b.className = "primary"; b.textContent = "▶ 터치해서 시작";
      b.style.cssText = "position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;width:auto;padding:18px 28px;font-size:18px";
      b.onclick = () => {
        try { const AC = window.AudioContext || window.webkitAudioContext; const ac = new AC(); ac.resume(); const o = ac.createBuffer(1, 1, 22050); const src = ac.createBufferSource(); src.buffer = o; src.connect(ac.destination); src.start(0); } catch (e) {}
        b.remove(); blog("tapped"); res();
      };
      $("gamewrap").appendChild(b);
    });
  }
  setStatus("에뮬레이터 불러오는 중…");
  startEmulator(rom, srm, startState);
}

let started = false, lastSrmSig = "", lastSrmUpload = 0;
const gm = () => window.EJS_emulator && window.EJS_emulator.gameManager;

/* 일정 시간 안에 게임이 안 켜지면 자동으로 한 번 다시 시도, 그래도 안 되면 버튼 표시 */
function startWatchdog() {
  setTimeout(() => {
    if (started) { try { sessionStorage.removeItem("m2retry"); } catch (e) {} return; }
    let n = 0; try { n = +sessionStorage.getItem("m2retry") || 0; } catch (e) {}
    if (n < 2) { try { sessionStorage.setItem("m2retry", n + 1); } catch (e) {} blog("watchdog_reload", n + 1); setTimeout(() => location.reload(), 800); return; }
    setStatus("게임이 켜지지 않았어요. 아래 버튼을 눌러 주세요.", "warn");
    const b = document.createElement("button"); b.className = "primary"; b.textContent = "다시 시도";
    b.style.cssText = "position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;width:auto";
    b.onclick = () => { try { sessionStorage.removeItem("m2retry"); } catch (e) {} location.reload(); };
    $("gamewrap").appendChild(b);
  }, 25000);
}
function startEmulator(rom, srm, startState) {
  window.EJS_player = "#game";
  window.EJS_core = "snes";
  window.EJS_gameName = "mother2";
  window.EJS_gameUrl = new File([rom], "mother2.sfc");
  window.EJS_pathtodata = EJS_DATA;
  window.EJS_startOnLoaded = true;
  window.EJS_color = "#ffcf4a";
  window.EJS_disableDatabases = true;   // 에뮬레이터 자체 캐시(IndexedDB) 끔: iOS에서 멈추는 원인
  // PC 키보드: 롬에서 필드의 A/L 역할을 바꿨으므로 A키 = A버튼(바로 말하기/조사), V키 = L버튼(메뉴)
  window.EJS_defaultControls = { 0: {
    0: { value: "c" },  1: { value: "x" },  2: { value: "enter" }, 3: { value: "space" },
    4: { value: "up arrow" }, 5: { value: "down arrow" }, 6: { value: "left arrow" }, 7: { value: "right arrow" },
    8: { value: "a" },  9: { value: "d" }, 10: { value: "v" }, 11: { value: "s" }
  }, 1: {}, 2: {}, 3: {} };
  window.EJS_Buttons = { rightClick: false, contextMenu: false };
  startWatchdog();
  let probes = 0;
  const probe = setInterval(() => {
    if (started || ++probes > 8) { clearInterval(probe); return; }
    const e = window.EJS_emulator, c = document.querySelector("#game canvas");
    blog("probe", JSON.stringify({ ejs: !!e, gm: !!(e && e.gameManager), st: e && e.started, failed: e && e.failedToStart, canvas: c ? c.width + "x" + c.height : null, txt: ($("game").innerText || "").slice(0, 80) }));
  }, 5000);
  window.EJS_ready = () => blog("ejs_ready");
  window.EJS_onLoadState = () => {};
  window.EJS_onGameStart = async () => {
    if (started) return; started = true;
    blog("game_start");
    try {
      if (srm) { writeSrm(srm.data); gm().restart(); lastSrmSig = sig(srm.data); }
      // 다시 켠 직후 실제 SRAM 상태를 기준으로 잡아서, 직접 저장하기 전에는 아무것도 올리거나 지우지 않음
      await new Promise(r => setTimeout(r, 3000));
      try { const cur = gm().getSaveFile(); if (cur && cur.length) lastSrmSig = sig(new Uint8Array(cur)); } catch (e) {}
      if (startState) { await new Promise(r => setTimeout(r, 800)); gm().loadState(startState); }
      setStatus(srm ? `세이브 불러옴 (${fmt(srm.time)})` : "새 게임", "ok");
      setTimeout(() => { const c = document.querySelector("#game canvas"); blog("after_start", c ? c.width + "x" + c.height : "no canvas"); }, 4000);
    } catch (e) { setStatus("세이브를 넣지 못했어요: " + e.message, "warn"); }
    setInterval(syncSrm, SRM_CHECK_SEC * 1000);
  };
  const s = document.createElement("script");
  s.src = EJS_DATA + "loader.js";
  s.onerror = () => setStatus("에뮬레이터를 받지 못했어요. 인터넷 연결을 확인해 주세요.", "warn");
  document.body.appendChild(s);
}

function writeSrm(data) {
  const g = gm(), FS = g.FS, path = g.getSaveFilePath();
  let cur = "";
  for (const part of path.split("/").slice(0, -1)) { if (!part) continue; cur += "/" + part; try { FS.mkdir(cur); } catch (e) {} }
  try { FS.unlink(path); } catch (e) {}
  FS.writeFile(path, data);
  g.loadSaveFiles();
}
function sig(u8) { let h = 0; for (let i = 0; i < u8.length; i++) h = (h * 31 + u8[i]) | 0; return u8.length + ":" + h; }

/* 게임 안에서 저장하면(SRAM이 바뀌면) 클라우드에 새 기록으로 올림 */
let syncing = false;
async function syncSrm() {
  const g = gm(); if (!g || !started || syncing) return;
  syncing = true;
  try {
    const raw = g.getSaveFile(); if (!raw || !raw.length) return;
    const data = new Uint8Array(raw), s = sig(data);
    if (s === lastSrmSig) return;
    if (!lastSrmSig && data.every(b => b === data[0])) return;   // 빈 세이브로 덮지 않기
    await up(`srm/${tsName()}.srm`, data);
    lastSrmSig = s; lastSrmUpload = Date.now();
    setCloud("☁ 세이브 저장됨 " + fmt(lastSrmUpload));
    prune("srm", 1).catch(() => {});   // 새로 저장하면 이전 세이브는 지움
  } catch (e) { setCloud("☁ 저장 실패, 다시 시도할게요"); }
  finally { syncing = false; }
}

async function saveState(kind) {
  const g = gm(); if (!g || !started) return;
  try {
    const st = new Uint8Array(await g.getState());
    await up(`states/${tsName()}-${kind}.state`, st);
    if (kind === "manual") setStatus("상태 저장됨 " + fmt(Date.now()), "ok");
    else setCloud("☁ 자동 상태 저장 " + fmt(Date.now()));
  } catch (e) { setStatus("상태 저장 실패: " + (e.message || e), "warn"); }
}

async function showHistory() {
  const body = $("histBody");
  body.innerHTML = '<p class="none">불러오는 중…</p>';
  $("dHistory").showModal();
  try {
    const mine = n => n.includes("-upload") || n.includes("-import");
    const firstMine = arr => arr.filter(f => mine(f.name)).concat(arr.filter(f => !mine(f.name)));
    const [states, srms] = (await Promise.all([ls("states", 60), ls("srm", 30)])).map(firstMine);
    body.innerHTML = "";
    const section = (title, items, render) => {
      const h = document.createElement("h4"); h.textContent = title; body.appendChild(h);
      if (!items.length) { const p = document.createElement("p"); p.className = "none"; p.style.fontSize = "13px"; p.textContent = "아직 없어요"; body.appendChild(p); }
      items.forEach(render);
    };
    const label = n => n.includes("-manual") ? "직접 저장" : n.includes("-import") ? "가져온 Snes9x 상태" : n.includes("-upload") ? "내가 올린 파일" : n.includes("-auto") ? "자동" : "게임 안 저장";
    const row = (text, tag, btnText, onClick, path) => {
      const d = document.createElement("div"); d.className = "slot";
      const sp = document.createElement("span"); sp.textContent = text;
      const t = document.createElement("span"); t.className = "tag"; t.textContent = tag; sp.appendChild(t);
      const acts = document.createElement("span"); acts.className = "acts";
      const b = document.createElement("button"); b.textContent = btnText; b.onclick = onClick;
      const x = document.createElement("button"); x.className = "x"; x.textContent = "✕"; x.title = "지우기"; x.setAttribute("aria-label", "지우기");
      x.onclick = async () => {
        $("dHistory").close();
        if (!await ask(`${text} (${tag})을 지울까요? 지운 건 되돌릴 수 없어요.`)) { showHistory(); return; }
        const r = await store().remove([P(path)]);
        setStatus(r.error ? "지우지 못했어요: " + r.error.message : `${text} 기록을 지웠어요`, r.error ? "warn" : "ok");
        showHistory();
      };
      acts.append(b, x); d.append(sp, acts); body.appendChild(d);
    };
    section("상태 저장", states, f => row(fmt(tsOf(f.name)), label(f.name), "불러오기", async () => {
      $("dHistory").close(); setStatus("상태 받는 중…");
      try { gm().loadState(await down(`states/${f.name}`)); setStatus(`상태 불러옴 (${fmt(tsOf(f.name))})`, "ok"); }
      catch (e) { setStatus("불러오기 실패: " + (e.message || e), "warn"); }
    }, `states/${f.name}`));
    section("게임 세이브 (아빠에게 전화)", srms, f => row(fmt(tsOf(f.name)), label(f.name), "이걸로 다시 켜기", async () => {
      $("dHistory").close();
      if (!await ask(`${fmt(tsOf(f.name))} 세이브로 처음부터 다시 켤까요? 지금 진행 중인 건 저장되지 않아요.`)) return;
      const data = await down(`srm/${f.name}`);
      writeSrm(data); gm().restart();
      lastSrmSig = sig(data);
      setStatus(`${fmt(tsOf(f.name))} 세이브로 다시 시작`, "ok");
    }, `srm/${f.name}`));
  } catch (e) { body.innerHTML = ""; const p = document.createElement("p"); p.className = "err"; p.textContent = "기록을 못 불러왔어요: " + (e.message || e); body.appendChild(p); }
}

async function exportSrm() {
  await syncSrm();
  const list = await ls("srm", 1);
  if (!list.length) { setStatus("아직 게임 세이브가 없어요", "warn"); return; }
  const data = await down(`srm/${list[0].name}`);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data]));
  a.download = "Mother2 Korean v2.6 투러커 모자.srm"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ---------- 로그인 ---------- */
async function login(signup) {
  const email = $("email").value.trim(), pin = $("pw").value.trim();
  $("loginErr").textContent = "";
  if (!pin) { $("loginErr").textContent = "번호를 넣어 주세요."; return; }
  const password = "mother2-pin-" + pin;   // Supabase는 6자 이상 비밀번호가 필요해서 앞에 붙임
  if (signup) {
    const r = await sb.rpc("mother2_setup", { p_pin: pin });
    if (r.error) { $("loginErr").textContent = "설정하지 못했어요: " + r.error.message; return; }
    if (r.data === "already") { $("loginErr").textContent = "이미 설정돼 있어요. 설정한 번호로 입장해 주세요."; $("bSignup").hidden = true; return; }
  }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    if (/not confirmed/i.test(error.message)) { $("loginErr").textContent = "설정 확인 대기 중이에요. 잠시 뒤 다시 눌러 주세요."; return; }
    if (/invalid login/i.test(error.message)) { $("loginErr").textContent = "번호가 맞지 않아요."; $("bSignup").hidden = false; return; }
    $("loginErr").textContent = error.message; return;
  }
  location.reload();
}

/* ---------- 연결 ---------- */

$("bSignup").onclick = () => login(true);
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") login(false); });

$("drop").onclick = () => picker.click();
picker.onchange = () => { takeFiles(picker.files); picker.value = ""; };
$("drop").addEventListener("dragover", e => { e.preventDefault(); $("drop").classList.add("over"); });
$("drop").addEventListener("dragleave", () => $("drop").classList.remove("over"));
$("drop").addEventListener("drop", e => { e.preventDefault(); $("drop").classList.remove("over"); takeFiles(e.dataTransfer.files); });
$("bUpload").onclick = uploadPending;
$("bSaveState").onclick = () => saveState("manual");
$("bHistory").onclick = showHistory;

$("bFull").onclick = () => {

  if (document.fullscreenElement) document.exitFullscreen();
  else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
};
$("bMenu").onclick = () => $("dMenu").showModal();
$("dMenuClose").onclick = () => $("dMenu").close();
$("bAddFiles").onclick = async () => { $("dMenu").close(); await syncSrm(); show("vUpload"); takeFiles([]); $("bUpload").textContent = "올리고 다시 켜기"; $("bUpCancel").hidden = false; };
$("bUpCancel").onclick = () => { pending.rom = pending.srm = pending.state = null; show("play"); };
$("bLogout").onclick = async () => { await syncSrm(); await sb.auth.signOut(); location.reload(); };
document.addEventListener("visibilitychange", () => { if (document.hidden) syncSrm(); });
window.addEventListener("pagehide", () => syncSrm());

(async () => {
  if (!cfg.SUPABASE_URL) { setStatus("config.js에 Supabase 주소가 없어요", "warn"); return; }
  const { data } = await sb.auth.getSession();
  if (!data.session) { show("vLogin"); setStatus("번호를 넣어 주세요"); $("pw").focus(); return; }
  uid = data.session.user.id;
  logOn = true; blog("boot", (navigator.standalone ? "homescreen " : "") + innerWidth + "x" + innerHeight);
  setCloud("☁ " + data.session.user.email);
  try { await boot(null); }
  catch (e) { setStatus("저장소에 연결하지 못했어요: " + (e.message || e), "warn"); }
})();
})();
